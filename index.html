<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #3f78b5;
        }

        .game {
            background-color: #65abe4;
            width: calc(100vw - (border-width * 2));
            height: 200px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            border-radius: 10px;
            border-style: solid;
            border-width: 4px;
            border-color: #2b5c90;
        }

        .cover {
            width: 180px;
            height: 180px;
            border-style: solid;
            border-color: #2548bb;
            border-radius: 5px;
            border-width: 3px;
            margin-left: 35px;
        }

        header {
            margin-left: 30px;
            font-size: 20;
            font-family: Georgia;
            color: #0c0056;
            white-space: nowrap;
        }

        .btn {
            display: flex;
            justify-content: center;
            position: absolute;
            left: 678px;
            min-width: calc(100vw - 693px);
        }

        button {
            appearance: none;
            background-color: transparent;
            border: 2px solid #1A1A1A;
            border-radius: 15px;
            box-sizing: border-box;
            color: #3B3B3B;
            cursor: pointer;
            display: inline-block;
            font-family: Roobert, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            font-size: 16px;
            font-weight: 600;
            line-height: normal;
            margin: 0;
            min-height: 60px;
            min-width: 94px;
            outline: none;
            padding: 16px 24px;
            text-align: center;
            text-decoration: none;
            transition: all 300ms cubic-bezier(.23, 1, 0.32, 1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 100%;
            will-change: transform;
            margin: 20%
        }

        button:disabled {
            pointer-events: none;
        }

        button:hover {
            color: #fff;
            background-color: #1A1A1A;
            box-shadow: rgba(0, 0, 0, 0.25) 0 8px 15px;
            transform: translateY(-2px);
        }

        button:active {
            box-shadow: none;
            transform: translateY(0);
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border: none;
            pointer-events: none;
        }

        iframe:not([src="about:blank"]) {
            pointer-events: auto;
        }

        #upload {
            min-width: 693px;
            text-align: center;
        }
    </style>
    <script>
        function loadIframe(location) {
            const iframe = document.getElementById("iframe");
            iframe.src = location;
        };
        function uploadGame() {
            const iframe = document.getElementById("iframe");
            const file = document.getElementById('filePicker').files[0];
            const core = document.getElementById('core').value;

            if (core == "") {
                alert("select a core");
                return
            };
            if (!file) {
                alert("select a file");
                return
            };

            window.EJS_core = core;
            window.EJS_gameName = file.name;
            window.EJS_gameUrl = URL.createObjectURL(file);
            iframe.src = "blankEJS.html";
        };
    </script>
</head>

<body>
    <div class="game">
        <img class="cover" src="alttp.webp">
        <header>The Legend of Zelda - A Link to the Past</header>
        <div class="btn"><button onclick="loadIframe('alttp.html')">Open Game</button></div>
    </div>
    <div class="game">
        <img class="cover" src="FF6-EternalCrystals.jpg">
        <header>Final Fantasy 6 - Eternal Crystals (ROM Hack)</header>
        <div class="btn"><button onclick="loadIframe('FFVI-EternalCrystals.html')">Open Game</button></div>
    </div>
    <div class="game">
        <div id="upload">
            <h1>upload your own rom</h1>
            <input type="file" id="filePicker">
            <select id="core" required>
                <option value="" disabled selected>Select a System</option>
                <option value="snes">Super Nintendo Entertainment System</option>
                <option value="gba">Game Boy Advanced</option>
            </select>
        </div>
        <div class="btn"><button onclick="uploadGame()">Upload File</button></div>
    </div>
    <iframe id="iframe" src="about:blank">
</body>

</html>
